# Render blueprint. Deploy this BEFORE polishing anything - the first deploy always
# fails for a boring reason, and you want it to fail while you still have hours.
services:
  - type: web
    name: smart-rental-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
